<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnApp — Teal &amp; Coral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Styled scrollbar */
  ::-webkit-scrollbar {
    width: 4px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--cream-deep);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--ink-tertiary);
  }

  :root {
    --cream: #FAF8F5;
    --cream-deep: #F2EDE6;

    /* Teal & Coral palette */
    --primary: #1A7A6A;
    --primary-light: #E0F5F0;
    --primary-pale: #F0FAF7;
    --accent: #C25060;
    --accent-light: #F4DEE2;
    --accent-pale: #FAF0F2;
    --secondary: #3A8A7A;
    --secondary-light: #D0EDE8;

    /* Task type colors */
    --task-survey: #A3BDD8;
    --task-survey-bg: #F5F8FC;
    --task-offers: #C4845E;
    --task-offers-bg: #FFF6F2;
    --task-receipts: #B89B4A;
    --task-receipts-bg: #FFFBF2;
    --progress: #0E9E7E;
    --progress-light: #D0F0E6;

    --ink: #2D2A26;
    --ink-secondary: #6B6560;
    --ink-tertiary: #9E968B;
    --white: #FFFFFF;
    --radius-card: 24px;
    --shadow-card: 0 2px 12px rgba(45, 42, 38, 0.06);
    --shadow-card-hover: 0 4px 20px rgba(45, 42, 38, 0.09);
  }

  body {
    background: transparent;
    font-family: 'Outfit', sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }

  .phone-frame {
    width: 375px;
    min-height: 812px;
    background: linear-gradient(170deg, #FDF8EE, #FAF8F5, #F8F6F2, #FDF8EE);
    background-size: 300% 300%;
    animation: warmShift 14s ease infinite;
    border-radius: 48px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.08),
      0 20px 60px rgba(0,0,0,0.12),
      0 4px 16px rgba(0,0,0,0.06);
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }
  .status-icons { display: flex; gap: 8px; align-items: center; }
  .status-icons svg { width: 16px; height: 16px; }

  .dynamic-island {
    width: 120px;
    height: 32px;
    background: #1a1a1a;
    border-radius: 24px;
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
  }

  .content {
    padding: 0 24px;
    padding-top: 56px;
    padding-bottom: 104px;
    height: 812px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  /* Greeting */
  .greeting-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 52px;
    position: relative;
  }
  .greeting-text {
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
  }
  .history-btn {
    position: absolute;
    right: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--cream-deep);
    color: var(--ink-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .streak-btn {
    position: absolute;
    left: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--cream-deep);
    color: var(--ink-tertiary);
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* Balance */
  .balance-section {
    margin-bottom: 28px;
  }
  .balance-label {
    font-size: 16px;
    font-weight: 500;
    color: var(--ink-tertiary);
    margin-bottom: 8px;
  }
  .balance-amount {
    font-size: 56px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -3px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .balance-delta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--progress);
    background: var(--progress-light);
    padding: 8px 16px;
    border-radius: 24px;
    margin-bottom: 24px;
  }
  .delta-arrow {
    width: 16px;
    height: 16px;
  }

  /* Balance row with ring */
  .balance-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .balance-left { flex: 1; }

  /* Cashout ring */
  .cashout-ring-wrap {
    width: 156px;
    height: 156px;
    position: relative;
    flex-shrink: 0;
    margin-top: -2px;
    margin-right: -16px;
  }
  .cashout-ring {
    width: 156px;
    height: 156px;
  }
  .cashout-ring circle:last-child {
    transition: stroke-dashoffset 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .cashout-ring-inner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -46%);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .cashout-ring-pct {
    font-size: 36px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -1.2px;
    line-height: 1;
  }
  .cashout-ring-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-tertiary);
    margin-top: 2px;
  }

  /* Section header */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--ink-tertiary);
  }
  .section-link {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    text-decoration: none;
  }

  /* Task grid */
  .task-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 24px;
  }

  /* Featured task */
  .task-featured {
    background: var(--white);
    border-radius: var(--radius-card);
    padding: 24px;
    box-shadow: var(--shadow-card);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .task-featured:hover {
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-1px);
  }
  .task-featured:active { transform: scale(0.985); }

  .featured-content { flex: 1; }
  .featured-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
    letter-spacing: -0.2px;
  }
  .featured-meta {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-tertiary);
  }

  /* Compact row tasks */
  .task-row-group {
    display: flex;
    gap: 16px;
  }
  .task-compact {
    flex: 1;
    background: var(--white);
    border-radius: var(--radius-card);
    padding: 16px;
    box-shadow: var(--shadow-card);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .task-compact:hover {
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-1px);
  }
  .task-compact:active { transform: scale(0.97); }

  .compact-icon {
    width: 40px;
    height: 40px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .compact-icon.offers { background: var(--task-offers-bg); }
  .compact-icon.receipts { background: var(--task-receipts-bg); }

  .compact-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
    letter-spacing: -0.1px;
  }
  .compact-time {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-tertiary);
  }

  /* Trust line */
  .trust-line {
    text-align: center;
    padding: 8px 0 24px;
  }
  .trust-content {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-tertiary);
  }
  .trust-icon {
    width: 16px;
    height: 16px;
    color: var(--primary);
  }

  /* Bottom nav — floating pill, soft contrast */
  .bottom-nav {
    position: sticky;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    margin-top: auto;
    padding-top: 16px;
  }
  .bottom-nav-inner {
    background: var(--primary);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 8px;
    display: flex;
    gap: 4px;
    box-shadow: 0 4px 24px rgba(26,122,106,0.3);
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 16px 24px;
    border-radius: 24px;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .nav-item.active {
    background: rgba(255,255,255,0.95);
  }
  .nav-icon {
    width: 24px;
    height: 24px;
    color: rgba(255,255,255,0.5);
    flex-shrink: 0;
    transition: color 0.2s ease;
  }
  .nav-item.active .nav-icon { color: var(--primary); }
  .nav-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--primary);
    display: none;
  }
  .nav-item.active .nav-label { display: block; }

  /* Floating petals */
  .petals {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .petal {
    position: absolute;
    bottom: -20px;
    left: var(--x);
    width: var(--w);
    height: var(--h);
    border-radius: 50% 0 50% 0;
    background: #FFFFFF;
    opacity: 0;
    animation: petalRise var(--dur) var(--delay) ease-in-out infinite;
  }
  @keyframes petalRise {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    6% { opacity: 0.6; }
    30% { transform: translateY(-250px) translateX(calc(var(--sway) * 0.5)) rotate(60deg); }
    60% { transform: translateY(-500px) translateX(calc(var(--sway) * -0.4)) rotate(150deg); opacity: 0.5; }
    85% { opacity: 0.3; }
    100% { transform: translateY(-850px) translateX(var(--sway)) rotate(260deg); opacity: 0; }
  }
  .content, .status-bar, .dynamic-island, .bottom-nav { position: relative; z-index: 1; }

  @keyframes warmShift {
    0% { background-position: 0% 0%; }
    25% { background-position: 100% 50%; }
    50% { background-position: 50% 100%; }
    75% { background-position: 0% 50%; }
    100% { background-position: 0% 0%; }
  }

  /* Entrance animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
  .greeting-row { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both; }
  .balance-section { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both; }
  .cashout-ring-wrap { animation: scaleIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both; }
  .section-header { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both; }
  .task-featured { animation: scaleIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both; }
  .task-row-group { animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.6s both; }
  .trust-line { animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.8s both; }
  .bottom-nav { animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="petals" aria-hidden="true">
    <span class="petal" style="--x:8%;  --w:5px; --h:8px; --dur:18s; --delay:0s;   --sway:25px;"></span>
    <span class="petal" style="--x:18%; --w:4px; --h:7px; --dur:22s; --delay:3s;   --sway:-20px;"></span>
    <span class="petal" style="--x:30%; --w:5px; --h:9px; --dur:20s; --delay:1s;   --sway:30px;"></span>
    <span class="petal" style="--x:40%; --w:4px; --h:6px; --dur:24s; --delay:6s;   --sway:-28px;"></span>
    <span class="petal" style="--x:52%; --w:5px; --h:8px; --dur:19s; --delay:2s;   --sway:22px;"></span>
    <span class="petal" style="--x:60%; --w:4px; --h:7px; --dur:21s; --delay:8s;   --sway:-18px;"></span>
    <span class="petal" style="--x:70%; --w:5px; --h:9px; --dur:23s; --delay:4s;   --sway:35px;"></span>
    <span class="petal" style="--x:80%; --w:4px; --h:6px; --dur:18s; --delay:10s;  --sway:-24px;"></span>
    <span class="petal" style="--x:90%; --w:5px; --h:8px; --dur:20s; --delay:5s;   --sway:20px;"></span>
    <span class="petal" style="--x:25%; --w:4px; --h:7px; --dur:25s; --delay:7s;   --sway:-32px;"></span>
    <span class="petal" style="--x:55%; --w:5px; --h:8px; --dur:22s; --delay:9s;   --sway:26px;"></span>
    <span class="petal" style="--x:75%; --w:4px; --h:7px; --dur:19s; --delay:11s;  --sway:-22px;"></span>
    <span class="petal" style="--x:15%; --w:5px; --h:9px; --dur:21s; --delay:12s;  --sway:30px;"></span>
    <span class="petal" style="--x:45%; --w:4px; --h:6px; --dur:24s; --delay:2.5s; --sway:-26px;"></span>
    <span class="petal" style="--x:85%; --w:5px; --h:8px; --dur:20s; --delay:14s;  --sway:18px;"></span>
  </div>
  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 11h2v4H1zm4-3h2v7H5zm4-3h2v10H9zm4-4h2v14h-2z"/></svg>
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2C5.2 2 2.8 3.4 1 5.5l1.2 1.2C3.6 4.8 5.7 3.5 8 3.5s4.4 1.3 5.8 3.2L15 5.5C13.2 3.4 10.8 2 8 2zm0 4c-1.7 0-3.2.8-4.2 2l1.2 1.2c.7-.9 1.8-1.5 3-1.5s2.3.6 3 1.5L12.2 8C11.2 6.8 9.7 6 8 6zm0 4c-.7 0-1.3.3-1.7.8L8 12.5l1.7-1.7C9.3 10.3 8.7 10 8 10z"/></svg>
      <svg viewBox="0 0 20 12" fill="currentColor"><rect x="0" y="1" width="16" height="10" rx="2" ry="2" stroke="currentColor" stroke-width="1" fill="none"/><rect x="2" y="3" width="10" height="6" rx="1"/><path d="M17 4v4c1 0 2-.9 2-2s-1-2-2-2z"/></svg>
    </div>
  </div>

  <div class="content">
    <!-- Greeting -->
    <div class="greeting-row">
      <span class="greeting-text">Good morning, Lisa</span>
      <div class="history-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      </div>
      <div class="streak-btn">7</div>
    </div>

    <!-- Balance with progress ring -->
    <div class="balance-section">
      <div class="balance-row">
        <div class="balance-left">
          <div class="balance-label">Your balance</div>
          <div class="balance-amount">$12.40</div>
          <div class="balance-delta">
            <svg class="delta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
            $1.25 today
          </div>
        </div>
        <div class="cashout-ring-wrap">
          <svg class="cashout-ring" viewBox="0 0 100 100">
            <!-- C=251.3 (r=40), 3 gaps of 14 (=20.1°). Arcs: prev=97.7, today=12.1, track=99.4 -->
            <!-- Track -->
            <circle cx="50" cy="50" r="40" fill="none" stroke="var(--cream-deep)" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="99.4 151.9" transform="rotate(107.4 50 50)"/>
            <!-- Previous balance -->
            <circle cx="50" cy="50" r="40" fill="none" stroke="var(--progress)" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="97.7 153.6" transform="rotate(-90 50 50)"/>
            <!-- Today's earnings -->
            <circle cx="50" cy="50" r="40" fill="none" stroke="var(--progress-light)" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="12.1 239.2" transform="rotate(70 50 50)"/>
          </svg>
          <div class="cashout-ring-inner">
            <span class="cashout-ring-pct">50%</span>
            <span class="cashout-ring-label">of $25</span>
          </div>
        </div>
      </div>
    </div>


    <!-- Continue Playing -->
    <div class="section-header">
      <span class="section-title">Continue playing</span>
    </div>

    <div style="background:var(--white);border-radius:var(--radius-card);padding:16px;box-shadow:var(--shadow-card);display:flex;align-items:center;margin-bottom:28px;cursor:pointer;">
      <img src="candy_crush.png" width="56" height="56" style="border-radius:14px;margin-right:16px;flex-shrink:0;" alt="Candy Crush Saga"/>
      <div style="flex:1;min-width:0;">
        <div style="font-size:16px;font-weight:600;color:var(--ink);margin-bottom:2px;">Candy Crush Saga</div>
        <div style="font-size:13px;font-weight:500;color:var(--ink-tertiary);margin-bottom:8px;">Reach Level 5 · $1.50</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="flex:1;height:6px;background:var(--cream-deep);border-radius:3px;overflow:hidden;">
            <div style="width:35%;height:100%;background:var(--primary);border-radius:3px;"></div>
          </div>
          <span style="font-size:11px;font-weight:600;color:var(--ink-tertiary);flex-shrink:0;">35%</span>
        </div>
      </div>
      <div style="width:44px;height:44px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><polygon points="8 5 20 12 8 19 8 5"/></svg>
      </div>
    </div>

    <!-- Tasks -->
    <div class="section-header">
      <span class="section-title">Available tasks</span>
      <a href="#" class="section-link">See all</a>
    </div>

    <div class="task-grid">
      <!-- Featured task -->
      <div class="task-featured">
        <div class="compact-icon" style="background: var(--task-survey-bg); width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--task-survey)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 14l2 2 4-4"/></svg>
        </div>
        <div class="featured-content">
          <div class="featured-name">Quick opinion survey</div>
          <div class="featured-meta">3 min · Share your thoughts</div>
        </div>
      </div>

      <!-- Two compact cards -->
      <div class="task-row-group">
        <div class="task-compact">
          <div class="compact-icon offers">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--task-offers)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          </div>
          <div class="compact-name">Offers</div>
          <div class="compact-time">Save & earn</div>
        </div>
